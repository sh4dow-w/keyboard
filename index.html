<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>keyboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
    <div class="keyboardContainer">

        <div class="row1">
            <div class="cbtn" id="btn_Escape">esc</div>
            <div class="cbtn" id="btn_F1">f1</div>
            <div class="cbtn" id="btn_F2">f2</div>
            <div class="cbtn" id="btn_F3">f3</div>
            <div class="cbtn" id="btn_F4">f4</div>
            <div class="cbtn" id="btn_F5">f5</div>
            <div class="cbtn" id="btn_F6">f6</div>
            <div class="cbtn" id="btn_F7">f7</div>
            <div class="cbtn" id="btn_F8">f8</div>
            <div class="cbtn" id="btn_F9">f9</div>
            <div class="cbtn" id="btn_F10">f10</div>
            <div class="cbtn" id="btn_F11">f11</div>
            <div class="cbtn" id="btn_F12">f12</div>
            <div class="cbtn" id="btn_PrintScreen">prtsc</div>
            <div class="cbtn" id="btn_Delete">delete</div>
        </div>

        <div class="row2">
            <div class="btn" id="btn_Backquote">`</div>
            <div class="btn" id="btn_Digit1">1</div>
            <div class="btn" id="btn_Digit2">2</div>
            <div class="btn" id="btn_Digit3">3</div>
            <div class="btn" id="btn_Digit4">4</div>
            <div class="btn" id="btn_Digit5">5</div>
            <div class="btn" id="btn_Digit6">6</div>
            <div class="btn" id="btn_Digit7">7</div>
            <div class="btn" id="btn_Digit8">8</div>
            <div class="btn" id="btn_Digit9">9</div>
            <div class="btn" id="btn_Digit0">0</div>
            <div class="btn" id="btn_Minus">-</div>
            <div class="btn" id="btn_Equal">=</div>
            <div class="---btn" id="btn_Backspace">backspace</div>
            <div class="cbtn" id="btn_Home">home</div>
        </div>

        <div class="row3">
            <div class="--btn" id="btn_Tab">tab</div>
            <div class="btn" id="btn_KeyQ">Q</div>
            <div class="btn" id="btn_KeyW">W</div>
            <div class="btn" id="btn_KeyE">E</div>
            <div class="btn" id="btn_KeyR">R</div>
            <div class="btn" id="btn_KeyT">T</div>
            <div class="btn" id="btn_KeyY">Y</div>
            <div class="btn" id="btn_KeyU">U</div>
            <div class="btn" id="btn_KeyI">I</div>
            <div class="btn" id="btn_KeyO">O</div>
            <div class="btn" id="btn_KeyP">P</div>
            <div class="btn" id="btn_BracketLeft">[</div>
            <div class="btn" id="btn_BracketRight">]</div>
            <div class="btn" id="btn_Backslash">\</div>
            <div class="cbtn" id="btn_End">end</div>
        </div>

        <div class="row4">
            <div class="---btn" id="btn_CapsLock">caps lock</div>
            <div class="btn" id="btn_KeyA">A</div>
            <div class="btn" id="btn_KeyS">S</div>
            <div class="btn" id="btn_KeyD">D</div>
            <div class="btn" id="btn_KeyF">F</div>
            <div class="btn" id="btn_KeyG">G</div>
            <div class="btn" id="btn_KeyH">H</div>
            <div class="btn" id="btn_KeyJ">J</div>
            <div class="btn" id="btn_KeyK">K</div>
            <div class="btn" id="btn_KeyL">L</div>
            <div class="btn" id="btn_Semicolon">;</div>
            <div class="btn" id="btn_Quote">'</div>
            <div class="----btn" id="btn_Enter">enter</div>
            <div class="cbtn" id="btn_PageUp">pgup</div>
        </div>

        <div class="row5">
            <div class="----btn" id="btn_ShiftLeft">shift</div>
            <div class="btn" id="btn_KeyZ">Z</div>
            <div class="btn" id="btn_KeyX">X</div>
            <div class="btn" id="btn_KeyC">C</div>
            <div class="btn" id="btn_KeyV">V</div>
            <div class="btn" id="btn_KeyB">B</div>
            <div class="btn" id="btn_KeyN">N</div>
            <div class="btn" id="btn_KeyM">M</div>
            <div class="btn" id="btn_Comma">,</div>
            <div class="btn" id="btn_Period">.</div>
            <div class="btn" id="btn_Slash">/</div>
            <div class="-----btn" id="btn_ShiftRight">shift</div>
            <div class="cbtn" id="btn_PageDown">pgdn</div>
        </div>

        <div class="row6">
            <div class="btn" id="btn_ControlLeft">ctrl</div>
            <div class="btn" id="btn_MetaLeft">win</div>
            <div class="btn" id="btn_AltLeft">alt</div>
            <div class="Spacebtn" id="btn_Space"></div>
            <div class="btn" id="btn_AltRight">alt</div>
            <div class="btn" id="btn_ControlRight">ctrl</div>
            <div class="btn" id="btn_ArrowLeft">◁</div>
            <div class="two">
                <div class="cbtn" id="btn_ArrowUp">△</div>
                <div class="cbtn" id="btn_ArrowDown">▽</div>
            </div>
            <div class="btn" id="btn_ArrowRight">▷</div>
        </div>

    </div>
</div>

<script src="main.js"></script>
</body>
</html>
